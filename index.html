<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Vitalis: whole-food recipes, a strict gluten-free and mineral-friendly collection, healthy eating rules and home workouts." />
    <meta name="theme-color" content="#0e2b27" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Vitalis – eat clean, move daily</title>
    <script>
      try {
        var t = localStorage.getItem('vitalis.theme');
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
        var l = localStorage.getItem('vitalis.lang');
        if (!l) { var n = (navigator.language || 'en').toLowerCase(); l = n.indexOf('ru') === 0 ? 'ru' : (n.indexOf('he') === 0 || n.indexOf('iw') === 0) ? 'he' : 'en'; }
        document.documentElement.lang = l;
        document.documentElement.dir = l === 'he' ? 'rtl' : 'ltr';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
